{% extends "./baza.html" %}
{%load static%}
{% block title %}Oferte{% endblock %}

{% block content %}
<h1 style="color:gold">Oferte</h1>
<form id="contactForm" method="post" class="form-contact">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="butoane2">
    <button type="submit" class="trimite">Trimite promotia</button>
  </div>
</form>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {
  e.preventDefault();
  const formData = new FormData(this);

  fetch("{% url 'contact' %}", {
    method: "POST",
    body: formData,
    headers: {
      "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
    }
  })
  .then(response => response.text())
  .then(html => {
    console.log("Mesaj salvat!");
  })
  .catch(err => console.error("Eroare:", err));
});
</script>
{% endblock %}
